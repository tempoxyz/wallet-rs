name: Lint

permissions: {}

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-lint:
    name: rust lint
    permissions:
      contents: read
    uses: tempoxyz/gh-actions/.github/workflows/rust-lint.yml@483bda4a2a4b5e04a51edff03768c1590d271f80 # v1
    with:
      clippy-runner: ubuntu-latest
      fmt-runner: ubuntu-latest
      typos-runner: ubuntu-latest
      deny-runner: ubuntu-latest
      rust-toolchain: nightly
      clippy-flags: --workspace --all-targets --all-features --locked
      deny-flags: ""

  tempo-lints:
    name: tempo-lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TEMPO_LINTS_REF: 0dbe62767b6e15963a652f5476bc0b8ae111d6fc
      TEMPO_LINTS_PNPM_VERSION: 10.28.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
      - name: Run Tempo Lints
        run: |
          set -euo pipefail

          # post-comment: false (emit annotations only; do not write to PRs from this fork-safe job)
          corepack enable
          corepack prepare "pnpm@${TEMPO_LINTS_PNPM_VERSION}" --activate

          lints_dir="$RUNNER_TEMP/tempo-lints"
          git init "$lints_dir"
          git -C "$lints_dir" remote add origin https://github.com/tempoxyz/lints.git
          git -C "$lints_dir" fetch --depth 1 origin "$TEMPO_LINTS_REF"
          git -C "$lints_dir" checkout --detach FETCH_HEAD

          pnpm --dir "$lints_dir" install --frozen-lockfile
          pnpm --dir "$lints_dir" exec tsx "$lints_dir/bin/tempo-lints.ts" rust "$GITHUB_WORKSPACE" --github-action

  lint-success:
    name: lint success
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    needs:
      - rust-lint
      - tempo-lints
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
