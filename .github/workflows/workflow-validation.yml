name: Workflow Validation

permissions: {}

on:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/**
      - .pinact.yaml
  pull_request:
    branches: [main, master]
    paths:
      - .github/workflows/**
      - .pinact.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    permissions:
      actions: read
      contents: read
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@183a02178c660ce295e9a262edc5857cb7135f06 # v1
    with:
      actionlint: true
      pinact: true

  workflow-policy:
    name: workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Enforce workflow security and fork-safety invariants
        run: |
          set -euo pipefail

          echo "Checking for mutable action refs..."
          if grep -REn "uses:[[:space:]]+[^#]+@(main|master)$" .github/workflows; then
            echo "::error::Found mutable action ref (@main/@master). Pin to a commit SHA."
            exit 1
          fi

          echo "Checking changelog fork behavior..."
          grep -n "if: github.event.pull_request.head.repo.full_name != github.repository" .github/workflows/changelog.yml >/dev/null
          grep -n "if: github.event.pull_request.head.repo.full_name == github.repository" .github/workflows/changelog.yml >/dev/null

          echo "Checking tempo-lints fork-safe mode..."
          grep -n "post-comment:[[:space:]]\+false" .github/workflows/lint.yml >/dev/null

          echo "Checking pr-audit pinning and trust gate..."
          if grep -n "tempoxyz/gh-actions/.github/workflows/pr-audit.yml@main" .github/workflows/pr-audit.yml; then
            echo "::error::pr-audit reusable workflow must be pinned to a commit SHA."
            exit 1
          fi
          grep -n "contains(fromJson('\[\"OWNER\",\"MEMBER\",\"COLLABORATOR\"\]'), github.event.comment.author_association)" .github/workflows/pr-audit.yml >/dev/null

          echo "Checking fork-safe changelog generation..."
          if grep -n "pull_request_target:" .github/workflows/changelog-generate.yml; then
            echo "::error::Changelog generation must not use pull_request_target."
            exit 1
          fi
          grep -n "^  pull_request:" .github/workflows/changelog-generate.yml >/dev/null
          grep -n "github.event.pull_request.head.repo.full_name == github.repository" .github/workflows/changelog-generate.yml >/dev/null
          grep -n "^  pull_request_target:" .github/workflows/changelog-fork-feedback.yml >/dev/null
          grep -n "github.event.pull_request.head.repo.full_name != github.repository" .github/workflows/changelog-fork-feedback.yml >/dev/null
          grep -n "For fork PRs, please add a changelog file manually" .github/workflows/changelog-fork-feedback.yml >/dev/null
          if grep -n "actions/checkout" .github/workflows/changelog-fork-feedback.yml; then
            echo "::error::Fork feedback workflow must not check out PR-controlled content."
            exit 1
          fi

          echo "Workflow policy checks passed."
